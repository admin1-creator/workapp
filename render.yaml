databases:
  - name: workapp-db
    plan: free
    databaseName: workapp
    user: workapp

services:
  - type: web
    plan: free
    name: workapp
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workapp-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
      - key: SIGNUP_INVITE_CODE
        sync: false
      - key: DEMO_SEED
        sync: false
      - key: DJANGO_DEMO_USERNAME
        sync: false
      - key: DJANGO_DEMO_PASSWORD
        sync: false
