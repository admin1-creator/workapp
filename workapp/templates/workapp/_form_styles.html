<style>
body {
    font-family: "Yu Gothic", "Meiryo", sans-serif;
    color: #111;
    max-width: 1680px;
    margin: 24px auto;
    padding: 0 16px 40px;
}
h2 { margin: 0 0 8px; }
nav { margin: 0 0 20px; color: #555; }
.note { color: #555; font-size: 0.9em; margin: 0 0 16px; }
.box {
    border: 1px solid #ccc;
    background: #fafafa;
    padding: 16px 20px;
    margin-bottom: 20px;
}
.box h3 {
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #333;
    font-size: 16px;
}
.grid {
    display: grid;
    grid-template-columns: 160px 1fr 160px 1fr;
    gap: 10px 12px;
    align-items: center;
}
.grid label { font-weight: bold; }
.field-input, select, input[type="text"], input[type="number"], input[type="date"] {
    width: 100%;
    max-width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    font-size: 15px;
}
.ime-hiragana {
    ime-mode: active !important;
    -webkit-ime-mode: active !important;
    -ms-ime-mode: hiragana !important;
}
.errors {
    color: #b00000;
    margin: 0 0 12px;
}
table.lines {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
}
table.lines th, table.lines td {
    border: 1px solid #ccc;
    padding: 6px 8px;
    text-align: left;
}
table.lines th { background: #f3f3f3; }
table.lines input, table.lines select { width: 100%; box-sizing: border-box; padding: 4px 6px; }
table.lines .num { width: 56px; }
table.lines .size { width: 108px; }
table.lines .mark { width: 72px; }
table.lines .money { width: 78px; }
table.lines .mode { width: 92px; }
table.lines th.col-rate { background: #d5e4f2; }
table.lines td.col-rate { background: #e7f0f8; }
table.lines th.col-sum { background: #ead9a3; }
table.lines td.col-sum { background: #f6edd4; }
table.lines td.col-rate input { background: #e7f0f8; }
table.lines td.col-sum input.manual-amount { background: #f6edd4; }
table.lines td.col-sum input.manual-amount.is-manual { background: #fff; }
table.lines td.col-rate input.rate-unit.is-manual { background: #fff; }
.lines-wrap { overflow-x: auto; }
.readonly-box {
    padding: 6px 8px;
    background: #eee;
    border: 1px solid #ccc;
    min-height: 22px;
}
button.save {
    margin-top: 8px;
    padding: 10px 24px;
    font-size: 16px;
}
@media (max-width: 800px) {
    .grid { grid-template-columns: 1fr; }
}
</style>
